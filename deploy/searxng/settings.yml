# Only free, keyless engines. No machine-specific paths.
use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo, wikipedia]
general:
  instance_name: H3-slides Search
search:
  safe_search: 1
  autocomplete: ""
  formats: [html, json]
server:
  limiter: false
  public_instance: false
  image_proxy: false
valkey:
  url: false
