name: h3-slides-search
services:
  search:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: "no"
    ports:
      - "127.0.0.1:${H3_SEARCH_PORT:-8080}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set a random secret in .env before starting}
      SEARXNG_BASE_URL: http://127.0.0.1:${H3_SEARCH_PORT:-8080}/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
volumes:
  search-cache:
